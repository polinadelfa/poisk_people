<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск пользователей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <h1>Поиск пользователей GitHub</h1>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Введите логин пользователя">
                <button id="search-btn">Поиск</button>
            </form>
            <div id="res"></div>

            <!-- Секция поиска -->
             <div class="search-history">
                <div class="history-title">История поиска</div>
                <ul id="history-list"></ul>
             </div>
        </div>
    </div>


    

    <script src="script.js"></script>
</body>
</html>
